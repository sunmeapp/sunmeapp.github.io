<style>

    --road: #4a4b50; --road-edge: #43444a; --park: #3b3f39; --wood: #373b35; --water: #2b3036;
    --label: #e4e4e2; --halo: #2a2b2f; --sun: #ff9238; --sun-soft: #6b4524; --dot: #7c7e86;
    --tree: #5c6453; --tree-fall: #7d6545; --tree-bare: #5a5650; --conifer: #4f5a4b;
    --ink: #efefed; --muted: #a3a5ad; --panel: rgba(36, 37, 41, 0.94); --panel-solid: #242529; --line: #393a3f; --chip: #333438; --uv2: #5a4127; --uv3: #8a5524; --uv4: #c2410c; --uv5: #7b3596;

  --ground: #3d3e42; --shade: #0b0c0f; --shade-a: 0.6; --bldg: #55575d; --bldg-edge: #64666d;
  --road: #4a4b50; --road-edge: #43444a; --park: #3b3f39; --wood: #373b35; --water: #2b3036;
  --label: #e4e4e2; --halo: #2a2b2f; --sun: #ff9238; --sun-soft: #6b4524; --dot: #7c7e86;
  --tree: #5c6453; --tree-fall: #7d6545; --tree-bare: #5a5650; --conifer: #4f5a4b;

body { background: var(--ground); color: var(--ink); font: 14px var(--f-ui); overflow: hidden; -webkit-tap-highlight-color: transparent; }

[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }

.row { display: flex; gap: 6px; flex-wrap: wrap; }
.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }

  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; flex: none; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--panel-solid); }

.chip.datechip[aria-pressed="true"] input { color: var(--panel-solid); }

input[type="range"]::-moz-range-track { height: 10px; border-radius: 5px; background: var(--trackbg, var(--chip)); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; margin-top: -8px; border-radius: 50%;

.label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.spots { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }

.spots li:last-child button { border-bottom: 0; }
.spots .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.spots small { color: var(--muted); flex: none; font-variant-numeric: tabular-nums; }
.sunglyph { width: 16px; height: 16px; flex: none; }
.empty { color: var(--muted); font-size: 13px; padding: 2px 0; }
@media (max-width: 759px) {
  .spots { flex-direction: row; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
  .spots li { flex: none; }
  .spots button { width: auto; height: 34px; padding: 0 12px; gap: 7px; border: 0; border-radius: 17px; background: var(--chip); }
  .spots .nm { max-width: 11em; }
  .time { font-size: 30px; }
}
.detail { display: flex; flex-direction: column; gap: 10px; }
.dhead { display: flex; gap: 10px; align-items: flex-start; }
.dhead > div { flex: 1; min-width: 0; }
.dname { font: 700 20px/1.15 var(--f-display); letter-spacing: -0.01em; text-wrap: balance; }
.dmeta { color: var(--muted); font-size: 13px; margin-top: 2px; }
.pill { flex: none; height: 26px; padding: 0 10px; border-radius: 13px; font-weight: 600; font-size: 12px; display: inline-flex; align-items: center; gap: 5px; }
.pill.sun { background: var(--sun); color: #2b1300; }
.pill.part { background: var(--sun-soft); color: var(--ink); }
.pill.shade { background: var(--ink); color: var(--panel-solid); }
.x { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--chip); font-size: 16px; line-height: 1; }
.strip { position: relative; display: flex; height: 22px; border-radius: 6px; overflow: hidden; background: var(--chip); }
.strip span { flex: 1; }
.strip i { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); border-radius: 1px; }
.axis { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; margin-top: 3px; }
.dsum { line-height: 1.45; }
.dsum strong { font-weight: 600; }
.uvbox { display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 1px solid var(--line); }
.uvhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.uvhead small { color: var(--muted); font-size: 11px; }
.uvrow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.uvc { border-radius: 10px; background: var(--chip); padding: 7px 6px 6px; display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0; }
.uvc .t { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.uvc .v { font: 700 22px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.uvc .l { font-size: 11px; font-weight: 600; white-space: nowrap; }
.uvc .w { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 3px; white-space: nowrap; }
.uvc .w .sunglyph { width: 12px; height: 12px; }
.uvc.l1 { background: var(--chip); } .uvc.l2 { background: var(--uv2); } .uvc.l3 { background: var(--uv3); } .uvc.l4 { background: var(--uv4); color: #fff; } .uvc.l5 { background: var(--uv5); color: #fff; }
.uvc.l4 .t, .uvc.l4 .w, .uvc.l5 .t, .uvc.l5 .w { color: rgba(255, 255, 255, 0.85); }
.uvnote { font-size: 13px; line-height: 1.4; }
.credit { font-size: 10.5px; color: var(--muted); line-height: 1.4; }
.credit a { color: inherit; }
.note { position: fixed; z-index: 7; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 66px); max-width: calc(100% - 32px);
  background: var(--ink); color: var(--panel-solid); padding: 8px 14px; border-radius: 16px; font-size: 13px; font-weight: 500; text-align: center; }
@media (min-width: 760px) { .note { top: calc(env(safe-area-inset-top, 0px) + 72px); } }
.maplibregl-ctrl-attrib { font-family: var(--f-ui); }
.maplibregl-ctrl-bottom-right { bottom: var(--sheet-h, 0px); }
@media (min-width: 760px) { .maplibregl-ctrl-bottom-right { bottom: 0; } }
</style>
</head>
<body>
<div id="map" role="application" aria-label="Map showing sun and shade"></div>

<div class="top">
  <div class="brand pillbar"><svg viewBox="0 0 32 32" aria-hidden="true"><g stroke="var(--sun)" stroke-width="3" stroke-linecap="round"><path d="M16 2v4M16 26v4M2 16h4M26 16h4M6 6l3 3M23 23l3 3M6 26l3-3M23 9l3-3"/></g><circle cx="16" cy="16" r="7" fill="var(--sun)"/></svg><span>sunme</span></div>
  <div class="search">
    <input class="pillbar" id="q" type="search" enterkeyhint="search" placeholder="Search a café, park or address" autocomplete="off" aria-label="Search a café, park or address">
    <ul class="results" id="results" hidden></ul>
  </div>
  <button class="locate pillbar" id="locate" type="button" aria-label="Show my location"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
</div>
<div class="note" id="note" hidden></div>

<section class="sheet" id="sheet">
  <div class="when">
    <svg class="dial" viewBox="0 0 52 52" aria-hidden="true">
      <circle class="hz" cx="26" cy="26" r="22"/><circle class="ring" cx="26" cy="26" r="14.7"/><circle class="ring" cx="26" cy="26" r="7.3"/>
      <text x="26" y="9.5">N</text>
      <line class="ray" id="dray" x1="26" y1="26" x2="26" y2="26"/><circle class="sunpt" id="dsun" cx="26" cy="26" r="4.5"/>
    </svg>
    <div class="clock"><div class="time" id="time">–</div><div class="sunline" id="sunline">&nbsp;</div></div>
    <button class="live" id="live" type="button" aria-pressed="true"><b></b>Live</button>
  </div>
  <div class="row" role="group" aria-label="Day">
    <button class="chip" id="dToday" type="button" aria-pressed="true">Today</button>
    <button class="chip" id="dTomorrow" type="button" aria-pressed="false">Tomorrow</button>
    <label class="chip datechip" id="dPickWrap" aria-pressed="false"><input id="dPick" type="date" aria-label="Pick a date"></label>
  </div>
  <div>
    <input id="slider" type="range" min="0" max="20" step="1" value="0" aria-label="Time of day in 30-minute steps">
    <div class="ends"><span id="rise"></span><span id="set"></span></div>
  </div>
  <div class="detail" id="detail" hidden>
    <div class="dhead">
      <div><div class="dname" id="dname"></div><div class="dmeta" id="dmeta"></div></div>
      <span class="pill" id="dpill"></span>
      <button class="x" id="dclose" type="button" aria-label="Close">×</button>
    </div>
    <div><div class="strip" id="strip"></div><div class="axis" id="axis"></div></div>
    <div class="dsum" id="dsum"></div>
    <div class="uvbox" id="uvbox" hidden>
      <div class="uvhead"><div class="label">UV index here</div><small id="uvsrc"></small></div>
      <div class="uvrow" id="uvrow"></div>
      <div class="uvnote" id="uvnote"></div>
    </div>
  </div>
  <div id="nearby" style="display:flex;flex-direction:column;gap:8px">
    <div class="row scroll" role="group" aria-label="Show">
      <button class="chip" type="button" data-k="c" aria-pressed="true">Cafés</button>
      <button class="chip" type="button" data-k="b" aria-pressed="true">Bars</button>
      <button class="chip" type="button" data-k="p" aria-pressed="true">Parks</button>
      <button class="chip" type="button" data-k="r" aria-pressed="false">Food</button>
      <button class="chip" type="button" id="treesChip" aria-pressed="true"><span id="treesLbl">Trees</span></button>
    </div>
    <div class="label" id="nlabel">&nbsp;</div>
    <ul class="spots" id="spots"></ul>
  </div>
  <div class="credit" id="credit">Shade from buildings and trees, computed on your device. UV forecast by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> (CC BY 4.0). Heights come from OpenStreetMap, so some are estimates; Toronto uses the City's lidar heights and tree survey. <a href="https://github.com/sunmeapp/sunmeapp.github.io" id="srcLink" target="_blank" rel="noopener">About</a></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<script>
(() => {
'use strict';
const RAD = Math.PI / 180;
const STEP_MIN = 30;
const CELL = 250, RCELL = 100, MAXL = 1800;
const MIN_SHADE_ZOOM = 14;
const TORONTO = { w: -79.445, s: 43.625, e: -79.355, n: 43.685, url: 'toronto.json' };
const $ = (id) => document.getElementById(id);

/* ======================= sun ======================= */
const J1970 = 2440588, J2000 = 2451545, OBL = RAD * 23.4397;
function sunPos(ms, lat, lng) {
  const d = ms / 864e5 - 0.5 + J1970 - J2000;
  const M = RAD * (357.5291 + 0.98560028 * d);
  const C = RAD * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M));
  const L = M + C + RAD * 102.9372 + Math.PI;
  const dec = Math.asin(Math.sin(OBL) * Math.sin(L)), ra = Math.atan2(Math.sin(L) * Math.cos(OBL), Math.cos(L));
  const H = RAD * (280.16 + 360.9856235 * d) + RAD * lng - ra, phi = RAD * lat;
  const alt = Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H));
  let az = Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(phi) - Math.tan(dec) * Math.cos(phi)) + Math.PI;
  az = ((az % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
  return { alt, az };
}
// Times are shown in the map location's own time zone (offline lookup), so 3 pm in London means London's 3 pm.
const DEVICE_TZ = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
let TZ = DEVICE_TZ;
const fmtCache = {}, partCache = {};
function tzFor(lat, lon) { try { return tzlookup(lat, lon) || DEVICE_TZ; } catch (e) { return DEVICE_TZ; } }
function zParts(ms) {
  const f = partCache[TZ] || (partCache[TZ] = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' }));
  const o = {}; for (const p of f.formatToParts(new Date(ms))) o[p.type] = p.value;

/* --- search: names in view instantly, places worldwide on Enter (OpenStreetMap Nominatim) --- */
const q = $('q'), res = $('results');
let hits = [], hi = 0, lastGeo = 0;
function showResults(list, extra) {
  hits = list; hi = 0; res.textContent = '';

    const li = document.createElement('li'), b = document.createElement('button'); b.type = 'button'; if (i === 0) b.className = 'on';

    const sm = document.createElement('small'); sm.textContent = h.kind;

}

  const t = q.value.trim().toLowerCase();
  if (t.length < 2) { res.hidden = true; return; }
  const local = S.spots.filter((s) => s.name.toLowerCase().includes(t)).slice(0, 6).map((s) => ({ label: s.name, kind: KNAME[s.k] + ' · nearby', spot: s }));
  showResults(local, 'Press Enter to search everywhere');
});
async function geoSearch(text) {

  const b = map.getBounds(), vb = [b.getWest(), b.getNorth(), b.getEast(), b.getSouth()].map((v) => v.toFixed(4)).join(',');
  showResults(hits.filter((h) => h.spot), 'Searching…');
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&viewbox=${vb}&q=${encodeURIComponent(text)}`, { headers: { 'Accept-Language': navigator.language || 'en' } });
    const data = await r.json();
    const geo = data.map((d) => ({ label: d.display_name.split(',').slice(0, 3).join(','), kind: (d.type || 'place').replace(/_/g, ' '), lon: +d.lon, lat: +d.lat, bbox: d.boundingbox && d.boundingbox.map(Number) }));

}

  if (e.key === 'Enter') { e.preventDefault(); const t = q.value.trim(); if (t.length >= 2) geoSearch(t); }
  if (e.key === 'Escape') { res.hidden = true; q.blur(); }
  if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && hits.length) {
    e.preventDefault(); hi = (hi + (e.key === 'ArrowDown' ? 1 : -1) + hits.length) % hits.length;

  }
});

  const small = !h.bbox || Math.abs(h.bbox[1] - h.bbox[0]) < 0.01;
  if (small) { map.once('moveend', () => select({ name: h.label.split(',')[0], meta: h.label, lon: h.lon, lat: h.lat, k: null }, false)); map.flyTo({ center: [h.lon, h.lat], zoom: 17, padding: mapPadding(), speed: 2 }); }

$('locate').addEventListener('click', () => {
  const btn = $('locate');
  if (!navigator.geolocation) { note('Location isn’t available in this browser.'); return; }
  btn.classList.add('busy');
  navigator.geolocation.getCurrentPosition((pos) => {
    btn.classList.remove('busy');
    const lon = pos.coords.longitude, lat = pos.coords.latitude, acc = pos.coords.accuracy;
    S.me = { lon, lat, acc };
    const mpp = 156543.03 * Math.cos(lat * RAD) / Math.pow(2, 17);
    map.getSource('me').setData(fc([{ type: 'Feature', geometry: { type: 'Point', coordinates: [lon, lat] }, properties: { px: Math.min(acc, 300) / mpp } }]));
    map.once('moveend', () => select({ name: 'You are here', meta: `Your location, within about ${Math.round(Math.min(acc, 999))} m`, lon, lat, k: null }, false));
    map.flyTo({ center: [lon, lat], zoom: 17, padding: mapPadding(), speed: 2 });
  }, () => { btn.classList.remove('busy'); note('Location was blocked. Allow it in your browser, or search instead.'); }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });

  refresh();
}
const mq = matchMedia('(prefers-color-scheme: dark)');
mq.addEventListener ? mq.addEventListener('change', retheme) : mq.addListener(retheme);
new ResizeObserver(() => document.documentElement.style.setProperty('--sheet-h', (window.innerWidth < 760 ? $('sheet').offsetHeight : 0) + 'px')).observe($('sheet'));
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
